services:
  backend:
    image: ghcr.io/moghaf/seatplan-backend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - seatplan-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Default=Data Source=data/seatplan.db
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - Jwt__Issuer=SeatPlan
      - Jwt__Audience=SeatPlanApp
      - Seed__Admin__Username=${SEED_ADMIN_USERNAME:-admin}
      - Seed__Admin__Password=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      - Seed__Admin__DisplayName=${SEED_ADMIN_DISPLAY_NAME:-Admin}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/functions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/moghaf/seatplan-frontend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  seatplan-data:
