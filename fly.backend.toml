app = "seatplan-backend"
primary_region = "ams"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "seatplan_data"
  destination = "/app/data"
