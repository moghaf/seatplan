services:
  backend:
    build:
      context: backend
    ports:
      - "5000:5000"
    volumes:
      - seatplan-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Data Source=data/seatplan.db
      - Seed__Admin__Username=${SEED_ADMIN_USERNAME:-admin}
      - Seed__Admin__Password=${SEED_ADMIN_PASSWORD:-admin}
      - Seed__Admin__DisplayName=${SEED_ADMIN_DISPLAY_NAME:-Admin}

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  seatplan-data:
