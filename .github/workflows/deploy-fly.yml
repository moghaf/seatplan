name: Deploy to Fly.io

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly.io
        run: |
          flyctl deploy \
            --image ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }} \
            --app ${{ secrets.FLY_BACKEND_APP_NAME }} \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy frontend to Fly.io
        run: |
          flyctl deploy \
            --image ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }} \
            --app ${{ secrets.FLY_FRONTEND_APP_NAME }} \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
