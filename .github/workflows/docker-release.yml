name: Build Docker Images & Create Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build-backend
        env:
          BACKEND_TAG: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
        run: |
          docker build -t $BACKEND_TAG backend/
          docker push $BACKEND_TAG

      - name: Build and push frontend image
        id: build-frontend
        env:
          FRONTEND_TAG: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
        run: |
          docker build -t $FRONTEND_TAG frontend/
          docker push $FRONTEND_TAG

      - name: Tag latest images
        env:
          BACKEND_LATEST: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          FRONTEND_LATEST: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          BACKEND_TAG: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          FRONTEND_TAG: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
        run: |
          docker tag $BACKEND_TAG $BACKEND_LATEST
          docker tag $FRONTEND_TAG $FRONTEND_LATEST
          docker push $BACKEND_LATEST
          docker push $FRONTEND_LATEST

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## SeatPlan ${{ github.ref_name }}

            ### Docker Images

            Pull the backend image:
            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ```

            Pull the frontend image:
            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ```

            ### Run with Docker Compose

            Use `docker compose up` with the provided `docker-compose.yml` after updating the image tags.
          draft: false
          prerelease: false
